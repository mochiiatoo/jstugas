<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <header class="header">
            <div>
                <span class="badge">HSI STUDENT MANAGEMENT</span>

                <h1>🎓 Student CRUD</h1>

                <p>
                    Kelola data siswa dengan mudah menggunakan
                    JavaScript dan LocalStorage.
                </p>
            </div>
        </header>


        <section class="content-grid">

            <!-- FORM -->
            <section class="card">

                <h2 id="formTitle">
                    ➕ Tambah Siswa
                </h2>

                <div id="message" class="message"></div>

                <form id="studentForm">

                    <div class="form-group">

                        <label for="studentName">
                            Nama Siswa
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            placeholder="Contoh: Ahmad"
                            autocomplete="off"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="studentScore">
                            Nilai
                        </label>

                        <input
                            type="number"
                            id="studentScore"
                            placeholder="0 - 100"
                            min="0"
                            max="100"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        id="submitButton"
                        class="primary-button"
                    >
                        ➕ Tambah Siswa
                    </button>


                    <button
                        type="button"
                        id="cancelButton"
                        class="secondary-button"
                        hidden
                    >
                        Batal Edit
                    </button>

                </form>

            </section>


            <!-- DAFTAR SISWA -->
            <section class="card">

                <div class="list-header">

                    <h2>
                        📋 Daftar Siswa
                    </h2>

                    <span class="storage-badge">
                        💾 LocalStorage
                    </span>

                </div>


                <div id="studentList" class="student-list">
                </div>


                <!-- STATISTIK -->
                <div class="stats">

                    <div class="stat-box">

                        <span>
                            Total Siswa
                        </span>

                        <strong id="totalStudents">
                            0
                        </strong>

                    </div>


                    <div class="stat-box">

                        <span>
                            Rata-rata Nilai
                        </span>

                        <strong id="averageScore">
                            0
                        </strong>

                    </div>

                </div>

            </section>

        </section>

    </main>

</body>
</html>
